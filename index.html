<style>

/* ============================= DATA LAYER (Firestore + Storage) ============================= */
async function getEvent(id){
  const doc = await db.collection('events').doc(id).get();
  return doc.exists ? doc.data() : null;
}
async function setEvent(id, data){
  await db.collection('events').doc(id).set(data);
}
async function listEvents(max=25){
  const snap = await db.collection('events').orderBy('createdAt','desc').limit(max).get();
  return snap.docs.map(d=>d.data());
}
async function getCodeInfo(code){
  const doc = await db.collection('codes').doc(code).get();
  return doc.exists ? doc.data() : null;
}
async function registerCodes(eventId, codes){
  const batch = db.batch();
  batch.set(db.collection('codes').doc(codes.admin), { eventId, role:'admin' });
  batch.set(db.collection('codes').doc(codes.public), { eventId, role:'public' });
  Object.entries(codes.epreuves).forEach(([epId,code])=>{
    batch.set(db.collection('codes').doc(code), { eventId, role:'animateur', epreuveId: epId });
  });
  await batch.commit();
}
async function getScores(eventId, epId){
  const doc = await db.collection('scores').doc(eventId+'__'+epId).get();
  return doc.exists ? (doc.data().rounds || {}) : {};
}
async function saveRoundScoreData(eventId, epId, roundIndex, raw){
  const ref = db.collection('scores').doc(eventId+'__'+epId);
  const update = {}; update['rounds.'+roundIndex] = raw; update.eventId = eventId; update.epreuveId = epId; update.updatedAt = Date.now();
  await ref.set(update, { merge:true });
}
async function clearScores(eventId, epId){
  await db.collection('scores').doc(eventId+'__'+epId).delete();
}
async function uploadPhoto(eventId, file, meta={}){
  const id = uid('ph');
  const ext = ((file.name||'jpg').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const type = meta.type || 'gallery';
  const path = `events/${eventId}/${type}/${id}.${ext}`;
  const ref = storage.ref().child(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  const doc = {
    id, eventId, type, url, path,
    epreuveId: meta.epreuveId || null,
    roundIndex: (meta.roundIndex!==undefined && meta.roundIndex!==null) ? meta.roundIndex : null,
    caption: meta.caption || '',
    createdAt: Date.now()
  };
  await db.collection('photos').doc(id).set(doc);
  return doc;
}
async function getEventPhotos(eventId){
  const snap = await db.collection('photos').where('eventId','==',eventId).get();
  return snap.docs.map(d=>d.data()).sort((a,b)=> b.createdAt - a.createdAt);
}
function pickAndUpload(eventId, meta, onDone){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.setAttribute('capture','environment');
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    toast('Envoi de la photo…');
    try{
      const doc = await uploadPhoto(eventId, file, meta);
      toast('Photo enregistrée ✓');
      if(onDone) onDone(doc);
    }catch(e){
      console.error(e);
      toast("Échec de l'envoi de la photo.");
    }
  };
  input.click();
}

/* ============================= UTIL ============================= */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function genCode(len=5){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<len;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; try{ const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){return d;} }

const BASE_PALETTE = [
  '#E63946','#1D4ED8','#16A34A','#F5B301','#7C3AED','#F97316','#EC4899','#06B6D4',
  '#92400E','#64748B','#14B8A6','#4338CA','#DC2626','#0EA5E9','#65A30D','#DB2777'
];
function colorForIndex(i){
  if(i < BASE_PALETTE.length) return BASE_PALETTE[i];
  const hue = (i*47) % 360;
  return `hsl(${hue} 70% 50%)`;
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); toast('Copié : '+text); }
  catch(e){ toast('Code : '+text); }
}

/* ============================= SCHEDULING ENGINE ============================= */
function pairKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
function computeGroupSizes(N, K, gMin, gMax){
  let activeK = K;
  while(activeK>1 && gMin*activeK > N) activeK--;
  let base = Math.floor(N/activeK);
  base = Math.max(gMin, Math.min(gMax, base));
  let sizes = new Array(activeK).fill(base);
  let total = base*activeK;
  let remainder = N-total;
  let i=0, guard=0;
  while(remainder>0 && guard<3000){
    if(sizes[i%activeK] < gMax){ sizes[i%activeK]++; remainder--; }
    i++; guard++;
  }
  return { sizes, resting: Math.max(0,remainder) };
}
function scoreAssignment(groups, epOrder, coOcc, visits){
  let score=0;
  groups.forEach((g,gi)=>{
    const ep=epOrder[gi];
    for(let a=0;a<g.length;a++){
      for(let b=a+1;b<g.length;b++){
        const c = coOcc[pairKey(g[a],g[b])]||0;
        score += (c+1)*(c+1);
      }
      const v = (visits[g[a]] && visits[g[a]][ep]) || 0;
      score += v*v*2;
    }
  });
  return score;
}
function generateSchedule({teamIds, epreuveIds, nbCreneaux, groupMin, groupMax}){
  const N=teamIds.length, K=epreuveIds.length;
  const coOcc={}, visits={}; teamIds.forEach(id=>visits[id]={});
  const restCount={}; teamIds.forEach(id=>restCount[id]=0);
  const rounds=[];
  for(let r=0;r<nbCreneaux;r++){
    const {sizes, resting} = computeGroupSizes(N,K,groupMin,groupMax);
    let activeEpreuves = epreuveIds;
    if(sizes.length < K){
      const restStart = r % K;
      activeEpreuves = [];
      for(let k=0;k<K && activeEpreuves.length<sizes.length;k++) activeEpreuves.push(epreuveIds[(restStart+k)%K]);
    }
    let best=null, bestScore=Infinity;
    const attempts = N>60 ? 12 : 30;
    for(let a=0;a<attempts;a++){
      let restingTeams=[];
      if(resting>0){
        const sorted=[...teamIds].sort((x,y)=> restCount[x]-restCount[y] || Math.random()-0.5);
        restingTeams = sorted.slice(0,resting);
      }
      let pool = teamIds.filter(id=>!restingTeams.includes(id));
      shuffle(pool);
      const groups=[]; let idx=0;
      sizes.forEach(sz=>{ groups.push(pool.slice(idx, idx+sz)); idx+=sz; });
      let epOrder=[...activeEpreuves]; shuffle(epOrder);
      const sc = scoreAssignment(groups, epOrder, coOcc, visits);
      if(sc<bestScore){ bestScore=sc; best={groups, epOrder, restingTeams}; }
    }
    const roundData={};
    best.groups.forEach((g,gi)=>{ roundData[best.epOrder[gi]]=g; });
    best.restingTeams.forEach(id=>restCount[id]++);
    best.groups.forEach((g,gi)=>{
      const ep=best.epOrder[gi];
      g.forEach(id=>{ visits[id][ep]=(visits[id][ep]||0)+1; });
      for(let x=0;x<g.length;x++) for(let y=x+1;y<g.length;y++) coOcc[pairKey(g[x],g[y])]=(coOcc[pairKey(g[x],g[y])]||0)+1;
    });
    rounds.push({ index:r, epreuves: roundData, resting: best.restingTeams });
  }
  return rounds;
}

/* ============================= RANKING FROM RAW SCORES (with ties) ============================= */
function computeRankPoints(teamIds, rawScores, lowerBetter){
  const size = teamIds.length;
  const sorted = [...teamIds].sort((a,b)=> lowerBetter ? rawScores[a]-rawScores[b] : rawScores[b]-rawScores[a]);
  const result = {};
  let i=0;
  while(i<sorted.length){
    let j=i;
    while(j+1<sorted.length && rawScores[sorted[j+1]]===rawScores[sorted[i]]) j++;
    const pts = size - i;
    for(let k=i;k<=j;k++) result[sorted[k]] = pts;
    i = j+1;
  }
  return result;
}

  app.innerHTML = topbarHTML() + `

      <div class="sub" style="margin-bottom:10px;">Code animateur (saisie des résultats) ou code classement (écran public).</div>

async function doJoin(){
  const codeEl = document.getElementById('joinCode');
  const errEl = document.getElementById('joinErr');
  const code = (codeEl.value||'').trim().toUpperCase();
  errEl.textContent='';
  if(!code){ errEl.textContent='Entre un code.'; return; }
  try{
    const info = await getCodeInfo(code);
    if(!info){ errEl.textContent='Code inconnu. Vérifie la saisie.'; return; }
    const ev = await getEvent(info.eventId);
    if(!ev){ errEl.textContent="Cet événement n'existe plus."; return; }
    if(info.role==='admin') setView('admin', { event: ev, role:'admin' });
    else if(info.role==='animateur') setView('animateur', { event: ev, role:'animateur', epreuveId: info.epreuveId });

function defaultWiz(){
  return {
    step:1,
    name:'', date:'', startTime:'09:00', slotMinutes:30,
    nbEpreuves:8,
    epreuveNames: Array.from({length:8},(_,i)=>'Épreuve '+(i+1)),
    epreuveLowerBetter: Array(8).fill(false),
    nbTeams:40,
    teams: Array.from({length:40},(_,i)=>({name:'Équipe '+(i+1), color: colorForIndex(i)})),
    groupMin:5, groupMax:5,
    nbCreneaux:8,
    useTimeLabels:false
  };
}
function startWizard(){ setView('wizard', { wiz: defaultWiz() }); }
function syncEpreuveNames(){
  const w=S.wiz; const n=w.nbEpreuves;
  const arr=[...w.epreuveNames];
  while(arr.length<n) arr.push('Épreuve '+(arr.length+1));
  arr.length=n;
  w.epreuveNames=arr;
  const lb=[...(w.epreuveLowerBetter||[])];
  while(lb.length<n) lb.push(false);
  lb.length=n;
  w.epreuveLowerBetter=lb;
}
function syncTeams(){
  const w=S.wiz; const n=w.nbTeams;
  const arr=[...w.teams];
  while(arr.length<n) arr.push({name:'Équipe '+(arr.length+1), color: colorForIndex(arr.length)});
  arr.length=n;
  w.teams=arr;
}

async function doGenerate(){
  const w=S.wiz;
  if(!w.name || !w.name.trim()){ toast('Donne un nom à ton événement.'); w.step=1; render(); return; }
  S.loading=true; render();

  try{
    const eventId = uid('evt');
    const epreuves = w.epreuveNames.map((n,i)=>({ id:'ep'+i+'_'+Math.random().toString(36).slice(2,6), name:n||('Épreuve '+(i+1)), lowerBetter: !!(w.epreuveLowerBetter && w.epreuveLowerBetter[i]) }));
    const teams = w.teams.map((t,i)=>({ id:'tm'+i+'_'+Math.random().toString(36).slice(2,6), name:t.name||('Équipe '+(i+1)), color:t.color }));

    const schedule = generateSchedule({
      teamIds: teams.map(t=>t.id),
      epreuveIds: epreuves.map(e=>e.id),
      nbCreneaux: w.nbCreneaux,
      groupMin: w.groupMin,
      groupMax: w.groupMax
    });

    let creneauLabels=[];
    if(w.useTimeLabels && w.startTime){
      const [h,m]=w.startTime.split(':').map(Number);
      let mins=h*60+m;
      for(let i=0;i<w.nbCreneaux;i++){
        const hh=Math.floor(mins/60)%24, mm=mins%60;
        creneauLabels.push(String(hh).padStart(2,'0')+'h'+String(mm).padStart(2,'0'));
        mins+=w.slotMinutes;
      }
    } else {
      creneauLabels = Array.from({length:w.nbCreneaux},(_,i)=>'Créneau '+(i+1));
    }

    const adminCode=genCode(5), publicCode=genCode(5);
    const epCodes={};
    epreuves.forEach(ep=> epCodes[ep.id]=genCode(5));

    const event = {
      id: eventId, name: w.name.trim(), date: w.date, createdAt: Date.now(),
      epreuves, teams, groupMin:w.groupMin, groupMax:w.groupMax,
      nbCreneaux: w.nbCreneaux, creneauLabels, schedule,
      codes: { admin: adminCode, public: publicCode, epreuves: epCodes }
    };

    await setEvent(eventId, event);
    await registerCodes(eventId, event.codes);

    S.loading=false;
    setView('codes', { event, role:'admin' });
  }catch(e){
    console.error(e);
    S.loading=false; render();
    toast("Erreur lors de la création. Vérifie la configuration Firebase et les règles Firestore.");
  }
}

async function computeStandings(ev){
  const points = {}; ev.teams.forEach(t=> points[t.id]=0);
  const played = {}; ev.teams.forEach(t=> played[t.id]=0);
  let totalRoundsScored=0, totalRoundsPossible=0;
  for(const ep of ev.epreuves){
    const rounds = await getScores(ev.id, ep.id);
    ev.schedule.forEach((rd,ri)=>{
      const g = rd.epreuves[ep.id];
      if(!g) return;
      totalRoundsPossible++;
      const raw = rounds[ri];
      const complete = raw && g.every(tid=> raw[tid]!==undefined && raw[tid]!==null && !isNaN(raw[tid]));
      if(complete){
        totalRoundsScored++;
        const rankPts = computeRankPoints(g, raw, !!ep.lowerBetter);
        g.forEach(tid=>{
          points[tid] = (points[tid]||0) + (rankPts[tid]||0);
          played[tid] = (played[tid]||0) + 1;
        });
      }
    });
  }
  const standings = ev.teams.map(t=>({ team:t, points: points[t.id]||0, played: played[t.id]||0 }))
    .sort((a,b)=> b.points-a.points || a.team.name.localeCompare(b.team.name));
  return { standings, totalRoundsScored, totalRoundsPossible };
}

async function renderAdminClassement(body){
  const ev=S.event;
  body.innerHTML = `<div class="card"><div class="sub">Calcul du classement…</div></div>`;
  const { standings, totalRoundsScored, totalRoundsPossible } = await computeStandings(ev);
  const maxPts = Math.max(1, ...standings.map(s=>s.points));
  body.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="h2" style="margin:0;"><span class="live-dot"></span>&nbsp; Classement en direct</div>
        <div class="pill">${totalRoundsScored}/${totalRoundsPossible} manches saisies</div>
      </div>
      ${standings.map((s,i)=>`
        <div class="lb-row">
          <div class="lb-rank ${i===0?'top1':''}">${i+1}</div>
          <div class="lb-bar-wrap">
            <div class="lb-name"><span class="dot" style="background:${s.team.color}"></span>${esc(s.team.name)} <span style="color:var(--text-faint);font-weight:400;font-size:11.5px;">(${s.played} manches)</span></div>
            <div class="lb-bar-bg"><div class="lb-bar" style="width:${(s.points/maxPts*100)}%;background:${s.team.color}"></div></div>
          </div>
          <div class="lb-pts">${s.points}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ============================= SCORE ENTRY (shared: animateur + admin) ============================= */
function drawTeamPoints(skey, epId, ri, group, ev, lowerBetter, photo, onPhotoUploaded){
  const el = document.getElementById('teamPoints_'+skey);
  if(!el) return;
  const local = animLocalScores[skey];
  const withVals = {};
  group.forEach(tid=>{ const v=local[tid]; if(v!==''&&v!==null&&v!==undefined&&!isNaN(v)) withVals[tid]=Number(v); });
  const preview = Object.keys(withVals).length>0 ? computeRankPoints(Object.keys(withVals), withVals, lowerBetter) : {};

  el.innerHTML = group.map(tid=>{
    const t = ev.teams.find(x=>x.id===tid);
    const val = local[tid];
    const pts = preview[tid];
    return `
      <div class="team-tap" style="cursor:default;">
        <div class="dot" style="background:${t.color}"></div>
        <div style="flex:1;font-weight:600;">${esc(t.name)}</div>
        ${pts!==undefined ? `<div class="pill" style="font-size:11px;">${pts} pt${pts>1?'s':''} classement</div>` : ''}
        <input type="number" step="any" inputmode="decimal" data-tid="${tid}" data-skey="${skey}" value="${val}" placeholder="Score" style="width:100px;text-align:right;">
      </div>`;
  }).join('') + `
    <div class="row" style="align-items:center;margin-top:6px;">
      <button class="btn ghost sm" id="photoBtn_${skey}" type="button">📷 ${photo?'Remplacer la photo':'Ajouter une photo preuve'}</button>
      ${photo?`<a href="${photo.url}" target="_blank"><img src="${photo.url}" class="photo-thumb"></a>`:''}
    </div>`;

  el.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.oninput = e=>{
      const tid=inp.dataset.tid, sk=inp.dataset.skey;
      animLocalScores[sk][tid] = e.target.value;
      drawTeamPoints(sk, epId, ri, group, ev, lowerBetter, photo, onPhotoUploaded);
      const again = document.querySelector(`input[data-tid="${tid}"][data-skey="${sk}"]`);
      if(again){ again.focus(); const p=again.value.length; try{ again.setSelectionRange(p,p); }catch(e){} }
    };
  });
  const photoBtn = document.getElementById('photoBtn_'+skey);
  if(photoBtn) photoBtn.onclick = ()=>{
    pickAndUpload(ev.id, { type:'result', epreuveId: epId, roundIndex: ri }, (doc)=>{
      if(onPhotoUploaded) onPhotoUploaded(doc);
    });
  };
}

async function saveRoundScores(ev, epId, ri, group, lowerBetter, skey){
  const local = animLocalScores[skey];
  const missing = group.some(tid=> local[tid]===''||local[tid]===null||local[tid]===undefined||isNaN(local[tid]));
  if(missing){ toast('Renseigne un score pour toutes les équipes avant d\u2019enregistrer.'); return; }
  const raw = {}; group.forEach(tid=> raw[tid]=Number(local[tid]));
  try{
    await saveRoundScoreData(ev.id, epId, ri, raw);
    const statusEl = document.getElementById('roundStatus_'+skey);
    if(statusEl) statusEl.textContent='✓ Enregistré';
    toast('Scores enregistrés ✓');
  }catch(e){
    console.error(e);
    toast("Échec de l'enregistrement. Réessaie.");
  }
}

async function renderAdminScores(body){
  const ev=S.event;
  body.innerHTML = `<div class="card"><div class="sub">Chargement…</div></div>`;
  const scoresByEp = {}, photos = await getEventPhotos(ev.id);
  for(const ep of ev.epreuves){ scoresByEp[ep.id] = await getScores(ev.id, ep.id); }

  const blocks = ev.epreuves.map(ep=>{
    const scores = scoresByEp[ep.id];
    const rounds = ev.schedule.map((rd,ri)=>({rd,ri})).filter(x=>x.rd.epreuves[ep.id]);
    const doneCount = rounds.filter(({ri})=>{
      const g = ev.schedule[ri].epreuves[ep.id];
      const raw = scores[ri];
      return raw && g.every(tid=> raw[tid]!==undefined && raw[tid]!==null && !isNaN(raw[tid]));
    }).length;
    return `
      <details class="card" style="padding:0;overflow:hidden;">
        <summary style="cursor:pointer;padding:16px 18px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span>${esc(ep.name)}${ep.lowerBetter?' <span style="font-size:11px;color:var(--text-faint);font-weight:500;">(chrono)</span>':''}</span>
          <span class="pill">${doneCount}/${rounds.length} saisis</span>
        </summary>
        <div style="padding:2px 18px 18px;" id="adminEpBlock_${ep.id}"></div>
      </details>`;
  }).join('');

  body.innerHTML = `<div class="sub" style="margin-bottom:10px;">Modifie ou saisis les scores de n'importe quelle épreuve, en plus des animateurs sur le terrain.</div>` +
    (blocks || `<div class="empty"><div class="big">🤷</div>Aucune épreuve.</div>`);

  for(const ep of ev.epreuves){
    const cont = document.getElementById('adminEpBlock_'+ep.id);
    if(!cont) continue;
    const scores = scoresByEp[ep.id];
    const rounds = ev.schedule.map((rd,ri)=>({rd,ri})).filter(x=>x.rd.epreuves[ep.id]);
    const lowerBetter = !!ep.lowerBetter;
    cont.innerHTML = (rounds.map(({rd,ri})=>{
      const group = rd.epreuves[ep.id];
      const skey = ep.id+'__'+ri;
      const saved = scores[ri];
      const isComplete = saved && group.every(tid=> saved[tid]!==undefined && saved[tid]!==null && !isNaN(saved[tid]));
      const local = {}; group.forEach(tid=> local[tid] = saved && saved[tid]!==undefined ? saved[tid] : '');
      animLocalScores[skey] = local;
      return `
        <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">
          <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:8px;">
            <div style="font-weight:700;font-size:13.5px;">${esc(ev.creneauLabels[ri]||('Créneau '+(ri+1)))}</div>
            <div class="pill" id="roundStatus_${skey}">${isComplete?'✓ Enregistré':'À saisir'}</div>
          </div>
          <div id="teamPoints_${skey}"></div>
          <div class="row" style="margin-top:8px;">
            <button class="btn ghost sm" id="resetBtn_${skey}">↺ Vider</button>
            <button class="btn primary sm" id="saveBtn_${skey}" style="margin-left:auto;">Enregistrer</button>
          </div>
        </div>`;
    }).join('')) || `<div class="sub" style="padding-top:10px;">Aucun créneau pour cette épreuve.</div>`;

    rounds.forEach(({rd,ri})=>{
      const group = rd.epreuves[ep.id];
      const skey = ep.id+'__'+ri;
      const photo = photos.find(p=> p.type==='result' && p.epreuveId===ep.id && p.roundIndex===ri) || null;
      drawTeamPoints(skey, ep.id, ri, group, ev, lowerBetter, photo, ()=> renderAdminScores(document.getElementById('adminBody')));
      document.getElementById('resetBtn_'+skey).onclick = ()=>{ group.forEach(tid=>animLocalScores[skey][tid]=''); drawTeamPoints(skey, ep.id, ri, group, ev, lowerBetter, photo, ()=> renderAdminScores(document.getElementById('adminBody'))); };
      document.getElementById('saveBtn_'+skey).onclick = ()=> saveRoundScores(ev, ep.id, ri, group, lowerBetter, skey);
    });
  }
}

/* ============================= PHOTOS: gallery grid + admin/leaderboard tabs ============================= */
function renderGalleryGrid(photos){
  if(!photos.length) return `<div class="empty"><div class="big">📷</div>Aucune photo pour le moment.</div>`;
  return `<div class="gallery-grid">${photos.map(p=>`<a href="${p.url}" target="_blank" title="${p.type==='result'?'Photo résultat':'Galerie'}"><img src="${p.url}" loading="lazy"></a>`).join('')}</div>`;
}
async function renderAdminPhotos(body){
  const ev=S.event;
  body.innerHTML = `<div class="card"><div class="sub">Chargement…</div></div>`;
  const photos = await getEventPhotos(ev.id);
  body.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="h2" style="margin:0;">Galerie de l'événement</div>
        <button class="btn primary sm" id="btnAddGalleryPhoto">+ Ajouter une photo</button>
      </div>
      ${renderGalleryGrid(photos)}
    </div>`;
  document.getElementById('btnAddGalleryPhoto').onclick = ()=>{
    pickAndUpload(ev.id, { type:'gallery' }, ()=> renderAdminPhotos(document.getElementById('adminBody')));
  };
}

/* ============================= ANIMATEUR VIEW ============================= */
async function renderAnimateur(){
  const ev=S.event; const epId=S.epreuveId;
  const ep = ev.epreuves.find(e=>e.id===epId);
  const app=document.getElementById('app');
  animLocalScores = {};

  const relevantRounds = ev.schedule.map((rd,ri)=>({rd,ri})).filter(x=> x.rd.epreuves[epId]);

  app.innerHTML = topbarHTML() + `
    <div class="back-link" id="backHome">← Quitter</div>
    <div class="row" style="align-items:center;justify-content:space-between;">
      <div class="h1" style="margin-bottom:2px;">🎯 ${esc(ep?ep.name:'Épreuve')}</div>
      <button class="btn ghost sm" id="btnAddGallery">📷 Galerie</button>
    </div>
    <div class="sub">${esc(ev.name)} · Code animateur actif${ep && ep.lowerBetter ? ' · Meilleur score = le plus bas (chrono)' : ''}</div>
    <div id="animRounds"></div>
    <div class="foot-note">Saisis le score obtenu par chaque équipe sur cet atelier. Le classement et les points (1er = nombre d'équipes du groupe, dernier = 1 point) sont calculés automatiquement, égalités comprises.</div>
  `;
  document.getElementById('backHome').onclick = ()=> setView('home');
  document.getElementById('btnAddGallery').onclick = ()=>{
    pickAndUpload(ev.id, { type:'gallery' }, ()=> toast('Photo ajoutée à la galerie de l\u2019événement ✓'));
  };

  const cont = document.getElementById('animRounds');
  if(relevantRounds.length===0){
    cont.innerHTML = `<div class="empty"><div class="big">🤷</div>Aucun créneau assigné à cette épreuve.</div>`;
    return;
  }

  const [scores, photos] = await Promise.all([ getScores(ev.id, epId), getEventPhotos(ev.id) ]);

  cont.innerHTML = relevantRounds.map(({rd,ri})=>{
    const group = rd.epreuves[epId];
    const saved = scores[ri];
    const isComplete = saved && group.every(tid=> saved[tid]!==undefined && saved[tid]!==null && !isNaN(saved[tid]));
    const local = {}; group.forEach(tid=> local[tid] = saved && saved[tid]!==undefined ? saved[tid] : '');
    const skey = epId+'__'+ri;
    animLocalScores[skey] = local;
    return `
    <div class="card" id="roundCard_${skey}">
      <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="h2" style="margin:0;">${esc(ev.creneauLabels[ri]||('Créneau '+(ri+1)))}</div>
        <div class="pill" id="roundStatus_${skey}">${isComplete ? '✓ Enregistré' : 'À saisir'}</div>
      </div>
      <div id="teamPoints_${skey}"></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost sm" id="resetBtn_${skey}">↺ Vider</button>
        <button class="btn primary sm" id="saveBtn_${skey}" style="margin-left:auto;">Enregistrer les scores</button>
      </div>
    </div>`;
  }).join('');

  relevantRounds.forEach(({rd,ri})=>{
    const group = rd.epreuves[epId];
    const lowerBetter = ep ? !!ep.lowerBetter : false;
    const skey = epId+'__'+ri;
    const photo = photos.find(p=> p.type==='result' && p.epreuveId===epId && p.roundIndex===ri) || null;
    drawTeamPoints(skey, epId, ri, group, ev, lowerBetter, photo, ()=> renderAnimateur());
    document.getElementById('resetBtn_'+skey).onclick = ()=>{ group.forEach(tid=> animLocalScores[skey][tid]=''); drawTeamPoints(skey, epId, ri, group, ev, lowerBetter, photo, ()=> renderAnimateur()); };
    document.getElementById('saveBtn_'+skey).onclick = ()=> saveRoundScores(ev, epId, ri, group, lowerBetter, skey);
  });
}

/* ============================= LEADERBOARD (public) ============================= */
async function renderLeaderboard(){
  const ev=S.event;
  const app=document.getElementById('app');
  app.innerHTML = topbarHTML() + `
    <div class="back-link" id="backHome">← Quitter</div>
    <div class="h1">🏆 ${esc(ev.name)}</div>
    <div class="tabs">
      <div class="tab ${lbTab==='classement'?'active':''}" data-lbtab="classement">Classement</div>
      <div class="tab ${lbTab==='galerie'?'active':''}" data-lbtab="galerie">Galerie</div>
    </div>
    <div id="lbBody"><div class="card"><div class="sub">Chargement…</div></div></div>
  `;
  document.getElementById('backHome').onclick = ()=> setView('home');
  document.querySelectorAll('[data-lbtab]').forEach(t=> t.onclick = ()=>{ lbTab=t.dataset.lbtab; renderLeaderboard(); });

  if(lbTab==='classement'){
    await drawLeaderboardBody();
    clearPoll();
    pollTimer = setInterval(()=>{ if(S.view==='leaderboard' && lbTab==='classement') drawLeaderboardBody(); }, 5000);
  } else {
    await drawGalleryBody();
    clearPoll();
    pollTimer = setInterval(()=>{ if(S.view==='leaderboard' && lbTab==='galerie') drawGalleryBody(); }, 8000);
  }
}
async function drawLeaderboardBody(){
  const ev=S.event;
  const el=document.getElementById('lbBody');
  if(!el) return;
  const { standings, totalRoundsScored, totalRoundsPossible } = await computeStandings(ev);
  const maxPts = Math.max(1, ...standings.map(s=>s.points));
  const now = new Date().toLocaleTimeString('fr-FR');
  el.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="pill"><span class="live-dot"></span>&nbsp;${totalRoundsScored}/${totalRoundsPossible} manches saisies</div>
        <div class="pill">Actualisé à ${now}</div>
      </div>
      ${standings.map((s,i)=>`
        <div class="lb-row">
          <div class="lb-rank ${i===0?'top1':''}">${i+1}</div>
          <div class="lb-bar-wrap">
            <div class="lb-name"><span class="dot" style="background:${s.team.color}"></span>${esc(s.team.name)}</div>
            <div class="lb-bar-bg"><div class="lb-bar" style="width:${(s.points/maxPts*100)}%;background:${s.team.color}"></div></div>
          </div>
          <div class="lb-pts">${s.points}</div>
        </div>
      `).join('')}
    </div>
  `;
}
async function drawGalleryBody(){
  const ev=S.event;
  const el=document.getElementById('lbBody');
  if(!el) return;
  const photos = await getEventPhotos(ev.id);
  el.innerHTML = `<div class="card">${renderGalleryGrid(photos)}</div>`;
}

/* ============================= ROUTER / RENDER ============================= */
function render(){
  clearPoll();
  if(S.view==='home') renderHome();
  else if(S.view==='wizard') renderWizard();
  else if(S.view==='codes') renderCodes();
  else if(S.view==='admin') renderAdmin();
  else if(S.view==='animateur') renderAnimateur();
  else if(S.view==='leaderboard') renderLeaderboard();
}

if(firebaseReady) render();
</script>
